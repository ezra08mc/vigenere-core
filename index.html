<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigenère Cipher</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="grid-noise" aria-hidden="true"></div>

  <header class="site-header">
    <div class="title-block">
      <h1>Vigenère Cipher</h1>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-mode="encrypt" role="tab" aria-selected="true">Enkripsi</button>
        <button class="tab" data-mode="decrypt" role="tab" aria-selected="false">Dekripsi</button>
      </div>

      <div class="panel-body">

        <div class="field">
          <label for="fileInput">File teks (.txt)</label>
          <div class="dropzone" id="dropzone">
            <input type="file" id="fileInput" accept=".txt,text/plain">
            <div class="dropzone-text">
              <span id="fileNameLabel">Pilih file atau seret ke sini</span>
              <span class="hint">.txt · maks 10 MB</span>
            </div>
            <button type="button" id="removeFileBtn" class="remove-file-btn" hidden aria-label="Hapus file yang diupload">✕ Hapus file</button>
          </div>
        </div>

        <div class="field">
          <label for="keyInput">Kunci cipher</label>
          <input type="text" id="keyInput" placeholder="contoh: KUNCI" autocomplete="off" spellcheck="false">
          <span class="field-note" id="keyNote">Hanya huruf A–Z yang digunakan; karakter lain diabaikan.</span>
        </div>

        <div class="field">
          <label for="inputText">Atau tempel teks langsung</label>
          <textarea id="inputText" rows="6" placeholder="Tempel isi teks di sini sebagai alternatif upload file…"></textarea>
        </div>

        <div class="actions">
          <button id="runBtn" class="btn-primary">Jalankan Enkripsi</button>
          <button id="clearBtn" class="btn-ghost">Bersihkan</button>
        </div>

        <div class="field result-field" id="resultField" hidden>
          <div class="result-head">
            <label>Hasil</label>
            <div class="result-actions">
              <button id="copyBtn" class="btn-small">Salin</button>
              <button id="downloadBtn" class="btn-small">Unduh .txt</button>
            </div>
          </div>
          <textarea id="outputText" rows="8" readonly></textarea>
        </div>

        <p class="status" id="statusMsg" role="status"></p>

      </div>
    </section>

  <script src="script.js"></script>
</body>
</html>
